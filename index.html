<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>물리학과 주막 POS</title>
  <style>
    :root {
      --bg: #101318;
      --card: #202633;
      --line: #343c4d;
      --text: #f6f3ec;
      --muted: #b7b0a4;
      --orange: #ff8a34;
      --orange-ink: #1a1008;
      --orange-bg: #2a2018;
      --blue: #2f6fed;
      --red: #ff6b6b;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1000px 420px at 0% -10%, rgba(255, 138, 52, .18), transparent 55%),
        radial-gradient(800px 380px at 100% 0%, rgba(47, 111, 237, .16), transparent 50%),
        var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    body.modal-open { overflow: hidden; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    h1, h2, h3, p { margin: 0; }
    .wrap { width: min(860px, calc(100% - 28px)); margin: 0 auto; }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 12px 0 14px;
      background: rgba(16, 19, 24, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand-row, .line, .acct, .cart-top, .amount-row, .dock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .eyebrow { color: var(--orange); font-size: .78rem; font-weight: 800; }
    h1 { font-size: 1.22rem; letter-spacing: -.03em; }
    .sync { margin: 4px 0 0; color: var(--muted); font-size: .82rem; font-weight: 800; }
    #clock { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }
    .tabs { display: flex; gap: 8px; margin-top: 12px; }
    .tabs button {
      flex: 1;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: #2a3140;
      font-weight: 800;
    }
    .tabs button.on { background: var(--orange); color: var(--orange-ink); }
    .acct {
      margin-top: 12px;
      padding: 12px;
      border-radius: 16px;
      background: #1a2030;
      border: 1px solid var(--line);
    }
    .bank { color: var(--muted); font-size: .86rem; font-weight: 700; }
    .acct-no { display: block; margin-top: 2px; font-size: 1.15rem; letter-spacing: .02em; white-space: nowrap; }
    .copy-btn, .primary, .pay, .ghost, .danger-btn, .zero, .list-btn, .menu-main, .stepper button {
      border: 0;
      border-radius: 12px;
      font-weight: 800;
    }
    .copy-btn, .zero, .list-btn {
      min-width: 72px;
      min-height: 48px;
      padding: 0 12px;
      background: var(--orange);
      color: var(--orange-ink);
    }
    .list-btn { background: #2a3140; color: var(--text); }
    main.wrap { padding: 16px 0 120px; }
    h2 { font-size: 1.25rem; }
    .quiet, .desc { color: var(--muted); }
    .cats { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; }
    .cats button {
      flex: 1 0 auto;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #2a3140;
      font-weight: 800;
      white-space: nowrap;
      padding: 0 14px;
    }
    .cats button.on { background: var(--orange); color: var(--orange-ink); }
    .menus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .menu {
      border-radius: 16px;
      border: 2px solid var(--line);
      background: var(--card);
      padding: 12px;
    }
    .menu.picked { border-color: var(--orange); }
    .menu-main { width: 100%; min-height: 88px; padding: 0; background: transparent; text-align: left; }
    .menu-main strong, .menu-main b, .desc { display: block; }
    .menu-main b { margin-top: 6px; color: var(--orange); }
    .desc { margin-top: 4px; font-size: .82rem; font-weight: 700; }
    .opts { display: grid; gap: 8px; margin-top: 8px; }
    .opts button { min-height: 48px; border: 0; border-radius: 12px; background: #2a3348; color: white; font-weight: 800; }
    .cart, .panel, .rank {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
    }
    .cart { margin: 14px 0; display: grid; gap: 12px; }
    .cart-line { padding-top: 8px; border-top: 1px solid var(--line); }
    .cart-line:first-of-type { border-top: 0; padding-top: 0; }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper button { width: 48px; height: 48px; background: #313a4e; color: white; font-size: 1.4rem; }
    .stepper b { min-width: 1.4ch; text-align: center; font-size: 1.2rem; }
    .amount-row { margin-top: 8px; }
    .amount-input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: #121722;
      padding: 0 12px;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .done-head { margin: 22px 0 10px; }
    .ranks { display: grid; gap: 10px; }
    .rank { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .rank b { font-size: 1.05rem; }
    .rank strong { text-align: right; font-variant-numeric: tabular-nums; }
    .rank strong span { display: block; margin-top: 2px; }
    .rank.total { border-color: var(--orange); }
    .orders { display: grid; gap: 8px; }
    .order {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .order:last-child { border-bottom: 0; }
    .text-btn { min-height: 44px; border: 0; background: transparent; color: var(--muted); font-weight: 800; }
    .danger-zone { margin-top: 22px; }
    .danger-btn { width: 100%; min-height: 56px; background: transparent; color: #ffd4d4; border: 2px solid var(--red); }
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      background: rgba(16, 19, 24, .96);
      border-top: 1px solid var(--line);
    }
    .dock .wrap { display: flex; align-items: center; gap: 12px; }
    .dock b { display: block; font-size: 1.25rem; }
    .dock .quiet { font-size: .82rem; font-weight: 700; }
    .pay { flex: 1; min-height: 56px; background: var(--blue); color: white; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, .62);
      padding: 16px;
    }
    .confirm {
      width: min(480px, 100%);
      padding: 18px;
      border-radius: 20px;
      background: #1b212c;
      border: 1px solid var(--line);
    }
    .confirm p { margin: 10px 0 16px; color: var(--muted); font-weight: 700; line-height: 1.45; }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions button { flex: 1; min-height: 52px; }
    .ghost { background: #2a3140; color: var(--text); }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 96px;
      z-index: 30;
      max-width: calc(100% - 32px);
      padding: 14px 18px;
      border-radius: 999px;
      background: #fff6e8;
      color: #1a1008;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
      transition: .2s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (min-width: 720px) {
      .menus { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .overlay { align-items: center; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const STORAGE_KEY = "jumak-festival-pos-v2";
    const ACCOUNT = {
      bank: "토스뱅크",
      number: "1000-3792-2507",
      holder: "윤제훈",
      copyText: "토스뱅크 1000-3792-2507 윤제훈"
    };
    const FESTIVAL_DAYS = [
      { key: "2026-10-01", label: "1일차" },
      { key: "2026-10-02", label: "2일차" }
    ];
    const CATEGORIES = [
      { id: "skewer", name: "꼬치류" },
      { id: "meal", name: "탕·식사·사이드" },
      { id: "drink", name: "하이볼·음료·생수" }
    ];
    const MENU = [
      { id: "modum", cat: "skewer", name: "모둠꼬치", desc: "염통 4 · 목살 2 · 닭껍질 2", price: 15900 },
      { id: "heart", cat: "skewer", name: "염통꼬치", desc: "4개", price: 5900 },
      { id: "pork", cat: "skewer", name: "목살꼬치", desc: "2개", price: 5900 },
      { id: "skin", cat: "skewer", name: "닭껍질꼬치", desc: "2개", price: 5900 },
      { id: "oden", cat: "meal", name: "오뎅전골", desc: "", price: 13900 },
      { id: "udon", cat: "meal", name: "야끼우동", desc: "", price: 16900 },
      { id: "potato", cat: "meal", name: "감자전", desc: "", price: 14900 },
      { id: "tomato", cat: "meal", name: "설탕토마토", desc: "", price: 7900 },
      { id: "earl", cat: "drink", name: "얼그레이 하이볼", desc: "", price: 3900 },
      { id: "grapefruit", cat: "drink", name: "자몽 하이볼", desc: "", price: 3900 },
      { id: "lemon", cat: "drink", name: "레몬 하이볼", desc: "", price: 3900 },
      { id: "drink", cat: "drink", name: "음료", desc: "콜라 · 제로콜라 · 사이다", price: 2500, options: ["콜라", "제로콜라", "사이다"] },
      { id: "water", cat: "drink", name: "생수", desc: "", price: 1000 }
    ];
    const CLOUD_APP = "6m8ooszg";
    const CLOUD_ROOT = "https://keyvalue.immanuel.co/api/KeyVal";

    let localOps = [];
    let syncedSet = new Set();
    let seenN = 0;
    let seenLast = "";
    let state = { orders: [] };
    let syncLabel = "연결하는 중";
    let chain = Promise.resolve();
    let toastTimer = 0;
    const ui = {
      day: "",
      cat: "skewer",
      optionFor: "",
      drafts: { "2026-10-01": [], "2026-10-02": [] },
      confirm: null
    };

    function uid() {
      return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
    }

    function dayKey(ts) {
      const date = new Date(ts);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${month}-${day}`;
    }

    function dayTitle(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day).toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
    }

    function activeDay() {
      if (FESTIVAL_DAYS.some((day) => day.key === ui.day)) return ui.day;
      const today = dayKey(Date.now());
      return today >= "2026-10-02" ? "2026-10-02" : "2026-10-01";
    }

    function won(amount) {
      return `${Number(amount || 0).toLocaleString("ko-KR")}원`;
    }

    function hhmm(ts) {
      return new Date(ts).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function lineKey(menuId, option) {
      return `${menuId}|${option || ""}`;
    }

    function itemLabel(item) {
      return item.option ? `${item.name} (${item.option})` : item.name;
    }

    function hydrate(item) {
      const menu = MENU.find((entry) => entry.id === item.menuId);
      return {
        menuId: item.menuId,
        name: menu ? menu.name : item.menuId,
        option: item.option || "",
        qty: item.qty || 0,
        price: menu ? menu.price : 0,
        amount: item.amount || 0
      };
    }

    function replay(ops) {
      const orders = [];
      ops.forEach((op) => {
        if (!op || !op.kind) return;
        if (op.kind === "R") {
          orders.length = 0;
          return;
        }
        if (op.kind === "O") {
          const items = (op.items || []).map(hydrate);
          orders.push({
            id: op.id,
            day: op.day,
            at: op.at,
            items,
            total: items.reduce((sum, item) => sum + (item.amount || 0), 0)
          });
        } else if (op.kind === "X") {
          const index = orders.findIndex((order) => order.id === op.orderId);
          if (index >= 0) orders.splice(index, 1);
        }
      });
      return { orders };
    }

    function loadBundle() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!data || !Array.isArray(data.ops)) return { ops: [], synced: [], headN: 0, headLast: "" };
        return {
          ops: data.ops,
          synced: Array.isArray(data.synced) ? data.synced : [],
          headN: data.headN || 0,
          headLast: data.headLast || ""
        };
      } catch (err) {
        return { ops: [], synced: [], headN: 0, headLast: "" };
      }
    }

    function saveLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          ops: localOps,
          synced: [...syncedSet],
          headN: seenN,
          headLast: seenLast
        }));
      } catch (err) {
        toast("이 브라우저에는 주문을 저장할 수 없습니다.");
      }
    }

    function rememberBundle() {
      const bundle = loadBundle();
      localOps = bundle.ops;
      syncedSet = new Set(bundle.synced);
      seenN = bundle.headN;
      seenLast = bundle.headLast;
      state = replay(localOps);
    }

    function bytesToB64url(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function b64urlToText(value) {
      let text = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
      while (text.length % 4) text += "=";
      const bin = atob(text);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function splitUtf8(text, maxBytes) {
      const enc = new TextEncoder();
      const parts = [];
      let current = "";
      for (const ch of text) {
        const next = current + ch;
        if (enc.encode(next).length > maxBytes && current) {
          parts.push(current);
          current = ch;
        } else current = next;
      }
      if (current) parts.push(current);
      return parts.length ? parts : [""];
    }

    async function cloudGet(key) {
      const res = await fetch(`${CLOUD_ROOT}/GetValue/${CLOUD_APP}/${key}`, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error("get");
      const raw = await res.text();
      if (!raw || raw === '""') return "";
      const data = JSON.parse(raw);
      if (!data) return "";
      return b64urlToText(data);
    }

    async function cloudPut(key, text) {
      const encoded = bytesToB64url(new TextEncoder().encode(text));
      const res = await fetch(`${CLOUD_ROOT}/UpdateValue/${CLOUD_APP}/${key}/${encoded}`, { method: "POST", signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error("put");
    }

    async function putBlob(id, text) {
      const parts = splitUtf8(text, 80);
      await cloudPut("n" + id, parts.length + "|" + parts[0]);
      for (let i = 1; i < parts.length; i++) await cloudPut("n" + id + "x" + i, parts[i]);
    }

    async function getBlob(id) {
      const first = await cloudGet("n" + id);
      const bar = first.indexOf("|");
      const count = Number(first.slice(0, bar));
      let text = first.slice(bar + 1);
      for (let i = 1; i < count; i++) text += await cloudGet("n" + id + "x" + i);
      return text;
    }

    function serialize(op) {
      if (op.kind === "O") {
        const items = op.items.map((item) => [item.menuId, item.qty, item.amount, item.option || ""].join(",")).join(";");
        return ["O", op.day, op.at, items].join("|");
      }
      if (op.kind === "X") return ["X", op.orderId].join("|");
      if (op.kind === "R") return ["R", op.epoch].join("|");
      return "";
    }

    function parseOp(text) {
      const parts = String(text || "").split("|");
      if (parts[0] === "O") {
        const items = (parts.slice(3).join("|") || "").split(";").filter(Boolean).map((row) => {
          const cols = row.split(",");
          return {
            menuId: cols[0],
            qty: Number(cols[1]) || 0,
            amount: Number(cols[2]) || 0,
            option: cols.slice(3).join(",")
          };
        });
        return { kind: "O", day: parts[1], at: Number(parts[2]) || 0, items };
      }
      if (parts[0] === "X") return { kind: "X", orderId: parts[1] };
      if (parts[0] === "R") return { kind: "R", epoch: Number(parts[1]) || 0 };
      return null;
    }

    async function readHead() {
      const raw = await cloudGet("h2");
      if (!raw) return { page: 0, n: 0, last: "" };
      const data = JSON.parse(raw);
      return { page: Number(data.page) || 0, n: Number(data.n) || 0, last: data.last || "" };
    }

    async function readAllIds(head) {
      if (!head.n) return [];
      const ids = [];
      for (let page = 0; page <= head.page; page++) {
        const text = await cloudGet("g" + page);
        if (text) ids.push(...text.split(",").filter(Boolean));
      }
      return ids;
    }

    async function appendToIndex(id) {
      for (let attempt = 0; attempt < 8; attempt++) {
        const head = await readHead();
        if (head.last === id) return head;
        const pageText = head.n ? await cloudGet("g" + head.page) : "";
        const pageIds = pageText ? pageText.split(",").filter(Boolean) : [];
        if (pageIds.includes(id)) return head;
        if (attempt > 0) {
          const all = await readAllIds(head);
          if (all.includes(id)) return head;
        }
        let page = head.page;
        let list = pageIds.concat(id);
        if (list.join(",").length > 120 && pageIds.length) {
          page += 1;
          list = [id];
        }
        await cloudPut("g" + page, list.join(","));
        const next = { page, n: head.n + 1, last: id };
        await cloudPut("h2", JSON.stringify(next));
        const check = await readHead();
        if (check.last === id) return check;
        await new Promise((resolve) => setTimeout(resolve, 150 * (attempt + 1)));
      }
      throw new Error("index");
    }

    function paintSync() {
      const el = document.getElementById("sync");
      if (el) el.textContent = syncLabel;
    }

    function enqueue(task) {
      chain = chain.then(task, task);
      return chain;
    }

    async function pushPending() {
      const pending = localOps.filter((op) => op && op.id && !syncedSet.has(op.id));
      if (!pending.length) return;
      syncLabel = "저장하는 중";
      paintSync();
      for (const op of pending) {
        await putBlob(op.id, serialize(op));
        const head = await appendToIndex(op.id);
        syncedSet.add(op.id);
        seenN = head.n;
        seenLast = head.last;
      }
      syncLabel = "다른 기기와 연결됨";
      saveLocal();
      paintSync();
    }

    async function pull() {
      const head = await readHead();
      if (!head.n && !localOps.length) {
        syncLabel = "다른 기기와 연결됨";
        paintSync();
        return;
      }
      if (head.n === seenN && head.last === seenLast) {
        syncLabel = "다른 기기와 연결됨";
        paintSync();
        return;
      }
      const ids = await readAllIds(head);
      const byId = new Map(localOps.map((op) => [op.id, op]));
      const remoteOps = [];
      for (const id of ids) {
        if (byId.has(id)) {
          remoteOps.push(byId.get(id));
          continue;
        }
        const parsed = parseOp(await getBlob(id));
        if (!parsed) continue;
        parsed.id = id;
        remoteOps.push(parsed);
      }
      const remoteIds = new Set(ids);
      const pending = localOps.filter((op) => op && op.id && !remoteIds.has(op.id));
      localOps = remoteOps.concat(pending);
      ids.forEach((id) => syncedSet.add(id));
      seenN = head.n;
      seenLast = head.last;
      const before = JSON.stringify(state.orders);
      state = replay(localOps);
      saveLocal();
      syncLabel = "다른 기기와 연결됨";
      const typing = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.amount;
      if (!typing && before !== JSON.stringify(state.orders)) render();
      else paintSync();
    }

    function commit(op) {
      localOps.push(op);
      state = replay(localOps);
      saveLocal();
      enqueue(() => pushPending());
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function currentDraft() {
      const day = activeDay();
      if (!ui.drafts[day]) ui.drafts[day] = [];
      return ui.drafts[day];
    }

    function cartTotal() {
      return currentDraft().reduce((sum, line) => sum + (Number(line.amount) || 0), 0);
    }

    function ordersOn(day) {
      return state.orders.filter((order) => order.day === day);
    }

    function addLine(menuId, option) {
      const menu = MENU.find((item) => item.id === menuId);
      if (!menu) return;
      const key = lineKey(menuId, option);
      const draft = currentDraft();
      const line = draft.find((item) => item.key === key);
      if (line) {
        if (line.qty >= 99) return;
        line.qty += 1;
        if (!line.custom) line.amount = line.price * line.qty;
        return;
      }
      draft.push({
        key,
        menuId: menu.id,
        name: menu.name,
        option: option || "",
        price: menu.price,
        qty: 1,
        amount: menu.price,
        custom: false
      });
    }

    function changeQty(key, delta) {
      const draft = currentDraft();
      const line = draft.find((item) => item.key === key);
      if (!line) return;
      line.qty = Math.min(99, line.qty + delta);
      if (line.qty <= 0) {
        ui.drafts[activeDay()] = draft.filter((item) => item !== line);
        return;
      }
      if (!line.custom) line.amount = line.price * line.qty;
    }

    function setAmount(key, amount, custom) {
      const line = currentDraft().find((item) => item.key === key);
      if (!line) return;
      line.amount = Math.max(0, Math.min(9999999, Math.floor(Number(amount) || 0)));
      line.custom = custom;
      if (!custom) line.amount = line.price * line.qty;
    }

    function submitOrder() {
      const draft = currentDraft().filter((line) => line.qty > 0);
      if (!draft.length) return;
      const day = activeDay();
      const items = draft.map((line) => ({
        menuId: line.menuId,
        qty: line.qty,
        amount: Number(line.amount) || 0,
        option: line.option || ""
      }));
      commit({ kind: "O", id: uid(), day, at: Date.now(), items });
      ui.drafts[day] = [];
      ui.confirm = null;
      const total = items.reduce((sum, item) => sum + item.amount, 0);
      toast(`${FESTIVAL_DAYS.find((item) => item.key === day).label}에 ${won(total)}을 접수했습니다.`);
      render();
    }

    function cancelOrder(orderId) {
      commit({ kind: "X", id: uid(), orderId });
      ui.confirm = null;
      toast("접수를 취소했습니다.");
      render();
    }

    function resetAll() {
      localOps = localOps.filter((op) => syncedSet.has(op.id));
      commit({ kind: "R", id: uid(), epoch: Date.now() });
      ui.drafts = { "2026-10-01": [], "2026-10-02": [] };
      ui.confirm = null;
      toast("전체 데이터를 초기화했습니다.");
      render();
    }

    function copyAccount() {
      const done = () => toast("계좌번호를 복사했습니다.");
      const fail = () => toast("복사에 실패했습니다. 숫자를 길게 눌러 복사해 주세요.");
      const fallback = () => new Promise((resolve, reject) => {
        const area = document.createElement("textarea");
        area.value = ACCOUNT.copyText;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        document.body.appendChild(area);
        area.select();
        try {
          document.execCommand("copy") ? resolve() : reject();
        } catch (err) {
          reject(err);
        } finally {
          area.remove();
        }
      });
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(ACCOUNT.copyText).then(done).catch(() => fallback().then(done).catch(fail));
        return;
      }
      fallback().then(done).catch(fail);
    }

    function menuStats(day) {
      const map = new Map();
      ordersOn(day).forEach((order) => {
        order.items.forEach((item) => {
          const key = lineKey(item.menuId, item.option);
          const prev = map.get(key) || { qty: 0, amount: 0 };
          prev.qty += item.qty;
          prev.amount += item.amount;
          map.set(key, prev);
        });
      });
      return map;
    }

    function renderHeader() {
      const day = activeDay();
      return `
        <header class="top">
          <div class="wrap">
            <div class="brand-row">
              <div>
                <p class="eyebrow">웃음꼬치 피식피식</p>
                <h1>물리학과 주막 POS</h1>
                <p class="sync" id="sync">${esc(syncLabel)}</p>
              </div>
              <time id="clock">${esc(hhmm(Date.now()))}</time>
            </div>
            <div class="tabs" role="tablist" aria-label="일차">
              ${FESTIVAL_DAYS.map((item) => `
                <button type="button" data-action="set-day" data-day="${item.key}" class="${item.key === day ? "on" : ""}">${item.label}${item.key === dayKey(Date.now()) ? " · 오늘" : ""}</button>
              `).join("")}
            </div>
            <div class="acct">
              <div>
                <span class="bank">${ACCOUNT.bank} · ${ACCOUNT.holder}</span>
                <strong class="acct-no">${ACCOUNT.number}</strong>
              </div>
              <button type="button" class="copy-btn" data-action="copy">계좌 복사</button>
            </div>
          </div>
        </header>`;
    }

    function renderCart() {
      const draft = currentDraft();
      if (!draft.length) return "";
      return `
        <section class="cart">
          <h2>담은 메뉴</h2>
          <p class="quiet">수량은 모두 세고, 받을 금액은 직접 입력하거나 0원을 누릅니다.</p>
          ${draft.map((line) => `
            <article class="cart-line">
              <div class="cart-top">
                <strong>${esc(itemLabel(line))}</strong>
                <span class="stepper">
                  <button type="button" data-action="dec" data-key="${esc(line.key)}" aria-label="${esc(itemLabel(line))} 수량 줄이기">−</button>
                  <b>${line.qty}</b>
                  <button type="button" data-action="inc" data-key="${esc(line.key)}" aria-label="${esc(itemLabel(line))} 수량 늘리기">+</button>
                </span>
              </div>
              <p class="quiet">정가 ${won(line.price)} · ${line.qty}개면 ${won(line.price * line.qty)}</p>
              <div class="amount-row">
                <input class="amount-input" inputmode="numeric" data-amount="${esc(line.key)}" value="${line.amount}" aria-label="${esc(itemLabel(line))} 받을 금액">
                <button type="button" class="zero" data-action="zero" data-key="${esc(line.key)}">0원</button>
                <button type="button" class="list-btn" data-action="list" data-key="${esc(line.key)}">정가</button>
              </div>
            </article>`).join("")}
        </section>`;
    }

    function renderMenus() {
      const draft = currentDraft();
      const menus = MENU.filter((menu) => menu.cat === ui.cat).map((menu) => {
        const picked = draft.some((line) => line.menuId === menu.id);
        const options = menu.options && ui.optionFor === menu.id
          ? `<div class="opts">${menu.options.map((opt) => `<button type="button" data-action="pick-option" data-id="${menu.id}" data-option="${esc(opt)}">${esc(opt)}</button>`).join("")}</div>`
          : "";
        return `
          <article class="menu ${picked ? "picked" : ""}">
            <button type="button" class="menu-main" data-action="add-item" data-id="${menu.id}">
              <strong>${esc(menu.name)}</strong>
              ${menu.desc ? `<span class="desc">${esc(menu.desc)}</span>` : ""}
              <b>${won(menu.price)}</b>
              <span class="desc">${menu.options ? (ui.optionFor === menu.id ? "종류 닫기" : "종류를 눌러 담기") : "눌러서 담기"}</span>
            </button>
            ${options}
          </article>`;
      }).join("");
      return `
        <div class="cats" role="tablist" aria-label="메뉴 분류">
          ${CATEGORIES.map((cat) => `<button type="button" data-action="set-cat" data-cat="${cat.id}" class="${ui.cat === cat.id ? "on" : ""}">${esc(cat.name)}</button>`).join("")}
        </div>
        <div class="menus">${menus}</div>`;
    }

    function renderStats(day) {
      const counts = menuStats(day);
      const rows = CATEGORIES.map((cat) => {
        const items = MENU.filter((menu) => menu.cat === cat.id).flatMap((menu) => {
          if (menu.options) {
            return menu.options.map((opt) => {
              const found = counts.get(lineKey(menu.id, opt)) || { qty: 0, amount: 0 };
              return { label: `${menu.name} (${opt})`, qty: found.qty, amount: found.amount };
            });
          }
          const found = counts.get(lineKey(menu.id, "")) || { qty: 0, amount: 0 };
          return [{ label: menu.name, qty: found.qty, amount: found.amount }];
        });
        return `
          <h3 class="done-head">${esc(cat.name)}</h3>
          <div class="ranks">${items.map((row) => `
            <article class="rank"><b>${esc(row.label)}</b><strong>${row.qty}개<span>${won(row.amount)}</span></strong></article>
          `).join("")}</div>`;
      }).join("");
      const orders = ordersOn(day);
      const qty = orders.reduce((sum, order) => sum + order.items.reduce((itemSum, item) => itemSum + item.qty, 0), 0);
      const total = orders.reduce((sum, order) => sum + order.total, 0);
      return `
        <h2 class="done-head">메뉴별 판매</h2>
        ${rows}
        <div class="ranks" style="margin-top:10px">
          <article class="rank total"><b>합계</b><strong>${qty}개<span>${won(total)}</span></strong></article>
        </div>`;
    }

    function renderOrders(day) {
      const orders = ordersOn(day).slice().sort((a, b) => b.at - a.at);
      if (!orders.length) return "";
      return `
        <h3 class="done-head">접수한 주문</h3>
        <section class="panel orders">${orders.map((order) => {
          const name = order.items[0] ? itemLabel(order.items[0]) : "주문";
          const extra = order.items.length > 1 ? ` 외 ${order.items.length - 1}` : "";
          return `
            <article class="order">
              <span>${esc(hhmm(order.at))} · ${esc(name + extra)}<br><strong>${won(order.total)}</strong></span>
              <button type="button" class="text-btn" data-action="ask-cancel" data-id="${esc(order.id)}">취소</button>
            </article>`;
        }).join("")}</section>`;
    }

    function renderConfirm() {
      const confirm = ui.confirm;
      if (!confirm) return "";
      return `
        <div class="overlay">
          <section class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
            <h3 id="confirm-title">${esc(confirm.title)}</h3>
            <p>${esc(confirm.message)}</p>
            <div class="confirm-actions">
              <button type="button" class="ghost" data-action="confirm-no">취소</button>
              <button type="button" class="${confirm.danger ? "danger-btn" : "pay"}" data-action="confirm-yes">${esc(confirm.yes)}</button>
            </div>
          </section>
        </div>`;
    }

    function renderDock() {
      const draft = currentDraft();
      if (!draft.length) return "";
      return `
        <div class="dock">
          <div class="wrap">
            <div>
              <span class="quiet">받을 금액</span>
              <b id="cart-total">${won(cartTotal())}</b>
            </div>
            <button type="button" class="pay" data-action="ask-submit">주문 접수</button>
          </div>
        </div>`;
    }

    function render() {
      const day = activeDay();
      ui.day = day;
      const meta = FESTIVAL_DAYS.find((item) => item.key === day);
      document.getElementById("app").innerHTML = `
        ${renderHeader()}
        <main class="wrap">
          <h2>${esc(meta.label)} 주문</h2>
          <p class="quiet">${esc(dayTitle(day))} · 할인은 금액을 고치고, 무료는 0원입니다.</p>
          ${renderCart()}
          ${renderMenus()}
          ${renderStats(day)}
          ${renderOrders(day)}
          <section class="panel danger-zone">
            <h3>데이터 초기화</h3>
            <p class="quiet" style="margin:8px 0 14px">1일차와 2일차 접수가 모두 삭제됩니다.</p>
            <button type="button" class="danger-btn" data-action="ask-reset">전체 초기화</button>
          </section>
        </main>
        ${renderDock()}
        ${renderConfirm()}`;
      document.body.classList.toggle("modal-open", Boolean(ui.confirm));
    }

    function onClick(event) {
      const btn = event.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === "set-day") {
        ui.day = btn.dataset.day;
        ui.optionFor = "";
        ui.confirm = null;
        render();
      } else if (action === "set-cat") {
        ui.cat = btn.dataset.cat;
        ui.optionFor = "";
        render();
      } else if (action === "add-item") {
        const menu = MENU.find((item) => item.id === btn.dataset.id);
        if (!menu) return;
        if (menu.options) {
          ui.optionFor = ui.optionFor === menu.id ? "" : menu.id;
          render();
          return;
        }
        addLine(menu.id, "");
        render();
      } else if (action === "pick-option") {
        addLine(btn.dataset.id, btn.dataset.option);
        ui.optionFor = "";
        render();
      } else if (action === "inc") {
        changeQty(btn.dataset.key, 1);
        render();
      } else if (action === "dec") {
        changeQty(btn.dataset.key, -1);
        render();
      } else if (action === "zero") {
        setAmount(btn.dataset.key, 0, true);
        render();
      } else if (action === "list") {
        setAmount(btn.dataset.key, 0, false);
        render();
      } else if (action === "ask-submit") {
        const day = FESTIVAL_DAYS.find((item) => item.key === activeDay());
        ui.confirm = {
          title: `${day.label} 주문 접수`,
          message: `${won(cartTotal())}으로 접수합니다. 수량은 그대로 집계되고, 입력한 금액이 매출입니다.`,
          yes: "주문 접수",
          danger: false,
          run: submitOrder
        };
        render();
      } else if (action === "ask-cancel") {
        const orderId = btn.dataset.id;
        ui.confirm = {
          title: "접수 취소",
          message: "이 접수를 취소하면 수량과 금액이 함께 빠집니다.",
          yes: "접수 취소",
          danger: true,
          run: () => cancelOrder(orderId)
        };
        render();
      } else if (action === "ask-reset") {
        ui.confirm = {
          title: "전체 초기화",
          message: "1일차와 2일차 접수가 모두 삭제됩니다. 삭제한 데이터는 되돌릴 수 없습니다.",
          yes: "전체 삭제",
          danger: true,
          run: resetAll
        };
        render();
      } else if (action === "confirm-no") {
        ui.confirm = null;
        render();
      } else if (action === "confirm-yes") {
        const run = ui.confirm && ui.confirm.run;
        ui.confirm = null;
        if (run) run();
        else render();
      } else if (action === "copy") copyAccount();
    }

    function onAmount(event) {
      const input = event.target.closest("[data-amount]");
      if (!input) return;
      const digits = String(input.value).replace(/[^\d]/g, "");
      const line = currentDraft().find((item) => item.key === input.dataset.amount);
      if (!line) return;
      line.amount = digits === "" ? 0 : Math.min(9999999, Number(digits));
      line.custom = true;
      if (input.value !== digits) input.value = digits;
      const total = document.getElementById("cart-total");
      if (total) total.textContent = won(cartTotal());
    }

    rememberBundle();
    const app = document.getElementById("app");
    app.addEventListener("click", onClick);
    app.addEventListener("input", onAmount);
    render();
    setInterval(() => {
      const clock = document.getElementById("clock");
      if (clock) clock.textContent = hhmm(Date.now());
    }, 1000);
    enqueue(async () => {
      try {
        await pushPending();
        await pull();
      } catch (err) {
        syncLabel = "연결을 다시 시도하는 중";
        paintSync();
      }
    });
    setInterval(() => {
      enqueue(async () => {
        try {
          await pushPending();
          await pull();
        } catch (err) {
          syncLabel = "연결을 다시 시도하는 중";
          paintSync();
        }
      });
    }, 2500);
  </script>
</body>
</html>
